services:
  - type: web
    name: election-awareness-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn election_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-domain.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: election-awareness-db
          property: connectionString

databases:
  - name: election-awareness-db
    plan: free
